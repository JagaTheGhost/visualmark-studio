name: Bug Report
description: Report a reproducible problem or unexpected behavior in VisualMark Studio
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please ensure you are running the latest version of VisualMark Studio before submitting.
        If this is a security vulnerability, please do NOT use this form; refer to our [Security Policy](../../SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When performing action X, unexpected behavior Y occurs...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open folder '...'
        2. Click on '...'
        3. Enter '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VisualMark Studio Version
      description: Version shown in the status bar or launcher (e.g. v1.1.1).
      placeholder: v1.1.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Attach screenshots, GIF recordings, or console error messages (Ctrl+` or developer tools).
    validations:
      required: false
