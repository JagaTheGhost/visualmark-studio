name: Release Desktop Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows (x64 Setup)
            os: windows-latest
            build-args: --win
          - name: Linux (x64 AppImage & deb)
            os: ubuntu-latest
            build-args: --linux
          - name: macOS Apple Silicon (arm64 zip)
            os: macos-14
            build-args: --mac --arm64
          - name: macOS Intel (x64 zip)
            os: macos-13
            build-args: --mac --x64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 2>/dev/null || sudo apt-get install -y libfuse2 2>/dev/null || true
          sudo apt-get install -y rpm desktop-file-utils libarchive-tools || true

      - name: Install Python Dependencies & Build Sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller
          python backend/build_sidecar.py

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Vite & Package Desktop Executable
        working-directory: ./frontend
        run: |
          npm run build
          npx electron-builder ${{ matrix.platform.build-args }} --publish never

      - name: Stage Release Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cd frontend/release
          echo "Listing generated files in release directory:"
          ls -lh
          # Collect distribution artifacts (excluding raw unpacked folders and blockmaps)
          find . -maxdepth 1 -type f \( \
            -name "*.exe" -o \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.dmg" -o \
            -name "*.zip" -o \
            -name "latest.yml" \
          \) -exec cp {} ../../dist-artifacts/ \;
          cd ../..
          echo "Staged artifacts ready for consolidation:"
          ls -lh dist-artifacts/

      - name: Upload Runner Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform.os }}-${{ strategy.job-index }}
          path: dist-artifacts/
          retention-days: 1

  publish-release:
    name: Consolidate & Publish GitHub Release
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Staged Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Verify Artifacts & Generate Checksums
        working-directory: all-artifacts
        run: |
          echo "=== Consolidated Release Artifacts ==="
          ls -lh
          echo "=== Generating SHA256SUMS.txt ==="
          # Generate SHA-256 checksum for all distributable binaries and packages
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          files: all-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
