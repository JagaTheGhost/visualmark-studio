version: 2
updates:
  # Monitor frontend dependencies (npm) - Silent security alerts, 0 PR spam
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # Monitor Python backend dependencies (pip) - Silent security alerts, 0 PR spam
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # Monitor GitHub Actions workflows - Silent security alerts, 0 PR spam
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
